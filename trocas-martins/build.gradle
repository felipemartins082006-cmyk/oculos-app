plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        trocasmartins { sourceSet sourceSets.main }
        "trocasmartins-gametest" { sourceSet sourceSets.gametest }
    }
    runs {
        // Testes automáticos: ./gradlew runGametest
        gametest {
            server()
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
            runDir "build/gametest"
            source sourceSets.gametest
        }
        // Fotos da tela no jogo de verdade (desenvolvimento): xvfb-run ./gradlew runFotos
        fotos {
            client()
            name "Fotos"
            vmArg "-Dfabric.client.gametest"
            runDir "build/fotos"
            source sourceSets.gametest
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    def v = project.version
    inputs.property "version", v
    filesMatching("fabric.mod.json") {
        expand "version": v
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
